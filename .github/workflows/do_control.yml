name: DO_Control_Pipeline_V3_3XUI

on:
  repository_dispatch:
    types: [do_action]

jobs:
  manage_droplet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      # --- [前置步骤] 只有在执行 create 或 setup 时才需要确定 IP ---
      - name: Get Current IP for Setup
        if: github.event.client_payload.task == 'create' || github.event.client_payload.task == 'setup'
        run: |
          echo "🔍 正在检索服务器 IP..."
          EXISTING_IP=$(doctl compute droplet list --format "PublicIPv4,Name" --no-header | grep "minidrop" | awk '{print $1}')
          if [ ! -z "$EXISTING_IP" ]; then
            echo "IP=$EXISTING_IP" >> $GITHUB_ENV
            echo "📍 目标 IP 已确定: $EXISTING_IP"
          fi

      # --- 功能 1：查询所有服务器并发送 Telegram 消息 ---
      - name: List All Droplets IP
        if: github.event.client_payload.task == 'list'
        run: |
          echo "🔎 正在抓取账号下所有服务器信息..."
          LIST=$(doctl compute droplet list --format "Name,PublicIPv4,Status" --no-header)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="📋 当前 DigitalOcean 服务器清单：
            $LIST"

      # --- 功能 2：销毁名为 minidrop 的服务器 ---
      - name: Destroy Droplet
        if: github.event.client_payload.task == 'delete'
        run: |
          echo "🗑️ 正在尝试销毁服务器..."
          ID=$(doctl compute droplet list --format "ID,Name" --no-header | grep "minidrop" | awk '{print $1}')
          if [ ! -z "$ID" ]; then
            doctl compute droplet delete $ID --force
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
              -d chat_id=${{ secrets.TG_CHAT_ID }} \
              -d text="✅ 已成功销毁名为 minidrop 的服务器"
          else
            echo "❓ 未发现名为 minidrop 的服务器"
          fi

      # --- 功能 3：创建最小规格服务器 (512MB) ---
      - name: Create Droplet
        if: github.event.client_payload.task == 'create'
        run: |
          echo "🏗️ 正在创建 512MB 最小规格服务器..."
          SSH_ID=$(doctl compute ssh-key list --format ID --no-header | head -n 1)
          doctl compute droplet create minidrop \
            --region sfo3 \
            --image ubuntu-24-04-x64 \
            --size s-1vcpu-512mb-10gb \
            --ssh-keys $SSH_ID \
            --wait
          IP=$(doctl compute droplet list --format "PublicIPv4,Name" --no-header | grep "minidrop" | awk '{print $1}')
          echo "IP=$IP" >> $GITHUB_ENV
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="🏗️ 服务器创建成功！ IP 地址：$IP"
          echo "⏳ 强制等待 30 秒确保 SSH 服务完全就绪..."
          sleep 30

      # --- 调试用：查看当前工作目录文件 ---
      - name: Debug - List workspace files
        if: (github.event.client_payload.task == 'create' || github.event.client_payload.task == 'setup') && env.IP != ''
        run: |
          echo "📂 当前工作目录文件列表："
          ls -la

      # --- 检查本地是否有 x-ui.db 文件 ---
      - name: Check if x-ui.db exists
        if: (github.event.client_payload.task == 'create' || github.event.client_payload.task == 'setup') && env.IP != ''
        id: check_db
        run: |
          if [ -f "x-ui.db" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到 x-ui.db，准备上传"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ 未找到 x-ui.db，将跳过数据库上传"
          fi

      # --- 功能 4：[安装阶段] 强行全自动静默安装 3X-UI 替换老 s-ui ---
      - name: Install 3X-UI and Wait
        if: (github.event.client_payload.task == 'create' || github.event.client_payload.task == 'setup') && env.IP != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          use_insecure_cipher: true
          port: 22
          timeout: 120s
          command_timeout: 20m
          script: |
            echo "📡 正在检测 SSH 连接状态..."
            for i in {1..12}; do
              if systemctl is-active ssh >/dev/null 2>&1; then
                echo "✅ SSH 服务已上线！"
                break
              fi
              echo "⏳ 等待 SSH 就绪 ($i/12)..."
              sleep 10
            done
            echo "🛠️ 开始通过高级管道控制 3X-UI 全自动静默安装 (默认跳过所有交互式键盘询问)..."
            export DEBIAN_FRONTEND=noninteractive
            printf "n" | bash <(curl -Ls https://raw.githubusercontent.com/MHSanaei/3x-ui/master/install.sh)
            sleep 5

      # --- 修改后的 SCP：把仓库里的 x-ui.db 搬运到新服务器 ---
      - name: SCP Database to VPS
        if: (github.event.client_payload.task == 'create' || github.event.client_payload.task == 'setup') && env.IP != '' && steps.check_db.outputs.exists == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          use_insecure_cipher: true
          port: 22
          timeout: 60s
          source: "x-ui.db"
          target: "/root/"
          strip_components: 0
          overwrite: true

      # --- 数据库不存在时的 Telegram 提示 ---
      - name: Notify - Skip DB Upload
        if: (github.event.client_payload.task == 'create' || github.event.client_payload.task == 'setup') && env.IP != '' && steps.check_db.outputs.exists == 'false'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="ℹ️ 未检测到本地 x-ui.db 文件，已跳过数据库上传。"

      # --- 功能 6：[配置阶段] 最终同步 3X-UI 数据库并重启 ---
      - name: Finalize 3X-UI and Sync DB
        if: (github.event.client_payload.task == 'create' || github.event.client_payload.task == 'setup') && env.IP != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          use_insecure_cipher: true
          port: 22
          timeout: 60s
          script: |
            echo "📁 正在执行 3X-UI 数据库覆盖与配置..."
            # 1. 暂时停掉 3x-ui 防止写操作冲突
            systemctl stop 3x-ui || true
            
            # 2. 强行建立 3x-ui 官方的新家文件夹
            mkdir -p /etc/3x-ui/
            
            # 3. 只有当确实从仓库拿到备份时才进行覆盖
            if [ -f "/root/x-ui.db" ]; then
              echo "📂 发现备份，正在将你的 x-ui.db 全自动覆盖并平移至 3X-UI 正确路径..."
              cp -f /root/x-ui.db /etc/3x-ui/3x-ui.db
            fi
            
            # 4. 【绝杀Bug】解锁全部读写权限，100%防止面板保存按钮变灰或死锁
            chmod 777 /etc/3x-ui/3x-ui.db || true
            
            echo "🔄 正在重启 3X-UI 核心系统使新节点生效..."
            systemctl daemon-reload
            systemctl restart 3x-ui
            echo "🎉 自动换库完成"
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
              -d chat_id=${{ secrets.TG_CHAT_ID }} \
              -d text="✅ 3X-UI 配置完成！ IP：${{ env.IP }} 数据库已同步。"

      # --- 错误处理 ---
      - name: Check IP Validity
        if: (github.event.client_payload.task == 'create' || github.event.client_payload.task == 'setup') && env.IP == ''
        run: |
          echo "❌ 错误：未获取到有效的 IP 地址！"
          exit 1
